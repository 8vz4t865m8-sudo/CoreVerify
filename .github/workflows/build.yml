name: build-coreverify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════
  #  Job 1：纯静态检查（Linux，秒级）
  #
  #  这一步不需要 Xcode，跑得飞快，
  #  能在等 macOS runner 排队之前就把低级错误挡住。
  # ═══════════════════════════════════════════════════════════
  static:
    name: 静态检查（Linux）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm

      # ── 工程一致性 / 代码安全 / 坐标合理性 / T3 凭据核对 ──
      - name: preflight（静态断言，含 T3 凭据交叉核对）
        run: |
          set -e
          python3 checks/preflight.py

      # ── Objective-C 语法检查 ──
      #
      #  ★ 核心一步：用 -target arm64-apple-ios14.0 + 最小 stub 头，
      #    在 Linux 上就能抓出 漏分号 / 括号不配对 / @end 缺失 /
      #    方法签名不匹配 / 类型未定义 这类真实编译错误。
      #    这些正是 macOS 上 make 最常见的失败原因。
      - name: Objective-C 语法检查
        run: |
          set -e
          chmod +x checks/syntax_check.sh
          ./checks/syntax_check.sh

  # ═══════════════════════════════════════════════════════════
  #  Job 2：真机构建（macOS + Xcode）
  # ═══════════════════════════════════════════════════════════
  build:
    name: 构建 dylib（macOS）
    runs-on: macos-14
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: 显示工具链
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version
          xcrun -sdk iphoneos --show-sdk-path

      # ── 构建 ──
      - name: make（双切片 arm64 + arm64e）
        run: make ARCHS="arm64 arm64e"

      - name: 列出产物
        run: ls -la CoreVerify.v1.dylib

      # ── 产物验证（postflight 的完整版，含 lipo/otool/nm）──
      - name: postflight（产物验证）
        run: |
          set -e
          python3 checks/postflight.py CoreVerify.v1.dylib

      # ── 关键断言（postflight 已经覆盖，这里再显式写一遍便于排错）──
      - name: ★ 架构断言
        run: |
          set -e
          lipo -info CoreVerify.v1.dylib
          ARCHS=$(lipo -archs CoreVerify.v1.dylib)
          echo "$ARCHS"
          echo "$ARCHS" | grep -q "arm64"  || { echo "❌ 缺 arm64 切片"; exit 1; }
          echo "$ARCHS" | grep -q "arm64e" || { echo "❌ 缺 arm64e 切片"; exit 1; }
          echo "✅ 双切片 arm64 + arm64e"

      - name: ★ install name 断言
        run: |
          set -e
          otool -D CoreVerify.v1.dylib
          otool -D CoreVerify.v1.dylib | grep -q "@executable_path/CoreVerify.v1.dylib" \
            || { echo "❌ install name 不对，注入后 dyld 找不到"; exit 1; }
          echo "✅ @executable_path/CoreVerify.v1.dylib"

      - name: ★ 依赖断言
        run: |
          set -e
          otool -L CoreVerify.v1.dylib
          LIBS=$(otool -L CoreVerify.v1.dylib | tail -n +2 | awk '{print $1}')
          for want in Foundation UIKit Security; do
            echo "$LIBS" | grep -q "$want.framework" \
              || { echo "❌ 缺 $want"; exit 1; }
          done
          echo "✅ Foundation / UIKit / Security 齐全"

      # ── 上传产物 ──
      #
      #  ★ 放在下面的显式断言**之前**。
      #    这样即使某条断言出意外（比如 otool 输出格式在新版 Xcode 变了），
      #    产物仍然能下载下来做本地分析 —— 调试成本天差地别。
      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: CoreVerify.v1.dylib
          path: CoreVerify.v1.dylib
          if-no-files-found: error
          retention-days: 30

      - name: ★ constructor 断言
        run: |
          set -e
          # ★ CoreVerifyEntry 是 `__attribute__((constructor)) static void`
          #   → static 意味着**局部符号**，`nm -gU`（只看全局）看不到它。
          #   所以主判据用 nm -a（含局部符号）。
          if nm -a CoreVerify.v1.dylib | grep -q "CoreVerifyEntry"; then
            echo "✅ 找到 constructor CoreVerifyEntry（局部符号）"
          else
            echo "❌ nm -a 里找不到 CoreVerifyEntry —— 注入后不会自动启动"
            exit 1
          fi

          # 补充信息：__mod_init_func 是 dyld 真正调用的初始化函数表。
          # ★ 这里只做打印，不做断言 —— otool 输出格式在不同 Xcode 版本间
          #   有差异，用它做硬判据太脆弱（上一版就是解析出空值导致误失败）。
          SIZE=$(otool -l CoreVerify.v1.dylib \
                 | grep -A 8 "sectname __mod_init_func" \
                 | awk '/size/ {print $2; exit}')
          echo "__mod_init_func size = ${SIZE:-<解析失败，忽略>}"

      - name: ★★★ 反向断言（不能有测试版后门痕迹）
        run: |
          set -e
          # ★ 必须按切片分别 strings！
          #   产物是 fat 二进制（arm64 + arm64e），直接对 fat 跑 strings
          #   会漏掉某些切片里的内容 —— 而这里是安全断言，
          #   漏检意味着后门可能溜过去。宁可慢一点也要查全。
          for arch in $(lipo -archs CoreVerify.v1.dylib); do
            lipo -thin "$arch" CoreVerify.v1.dylib -output "/tmp/thin-$arch"
            strings -a "/tmp/thin-$arch" >> /tmp/all-strings.txt
            echo "  已提取 $arch 切片字符串"
          done
          # 再补一次整体（双保险）
          strings -a CoreVerify.v1.dylib >> /tmp/all-strings.txt
          echo "  字符串总数: $(wc -l < /tmp/all-strings.txt)"

          for bad in "2099-12-31" "t.me/cheatrev" "CoreHomeLinkTarget" \
                     "CoreHomeRewriteControls" "1970-01-01 00:00:01"; do
            if grep -q "$bad" /tmp/all-strings.txt; then
              echo "❌ 出现测试版痕迹: $bad"
              exit 1
            fi
          done
          echo "✅ 无 2099 硬编码 / 无 Telegram 跳转 / 无按钮劫持残留"

      - name: 生成校验信息
        run: |
          echo "## CoreVerify.v1.dylib" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la CoreVerify.v1.dylib >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          lipo -info CoreVerify.v1.dylib >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          otool -D CoreVerify.v1.dylib >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          shasum -a 256 CoreVerify.v1.dylib >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
